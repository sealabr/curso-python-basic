<!doctype html>
<html lang="en">
  <head>
    <style>
      table {
        border: 1px solid #ccc;
        border-collapse: collapse;
        margin: 0;
        padding: 0;
        width: 100%;
        table-layout: fixed;
      }

      table caption {
        font-size: 1.5em;
        margin: 0.5em 0 0.75em;
      }

      table tr {
        background-color: #f8f8f8;
        border: 1px solid #ddd;
        padding: 0.35em;
      }

      table th,
      table td {
        padding: 0.625em;
        text-align: center;
      }

      table th {
        font-size: 0.85em;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      @media screen and (max-width: 600px) {
        table {
          border: 0;
        }

        table caption {
          font-size: 1.3em;
        }

        table thead {
          border: none;
          clip: rect(0 0 0 0);
          height: 1px;
          margin: -1px;
          overflow: hidden;
          padding: 0;
          position: absolute;
          width: 1px;
        }

        table tr {
          border-bottom: 3px solid #ddd;
          display: block;
          margin-bottom: 0.625em;
        }

        table td {
          border-bottom: 1px solid #ddd;
          display: block;
          font-size: 0.8em;
          text-align: right;
        }

        table td::before {
          /*
    * aria-label has no advantage, it won't be read inside a table
    content: attr(aria-label);
    */
          content: attr(data-label);
          float: left;
          font-weight: bold;
          text-transform: uppercase;
        }

        table td:last-child {
          border-bottom: 0;
        }
      }

      /* general styling */
      body {
        font-family: "Open Sans", sans-serif;
        line-height: 1.25;
      }
    </style>
  </head>

  <body translate="no">
    <table>
      <caption>
        Dados salvos no formulário
      </caption>
      <thead>
        <tr>
          <th scope="col">Nome</th>
          <th scope="col">Telefone</th>
          <th scope="col">CPF</th>
          <th scope="col">email</th>
          <th scope="col">Editar</th>
        </tr>
      </thead>
      <tbody id="tbody-corpo"></tbody>
    </table>

    <script>
      const tbody = document.querySelector("#tbody-corpo");

      fetch("/getformulario")
        .then((resposta) => resposta.json())
        .then((dados) => {
          let linhas = "";

          dados.forEach((item) => {
            linhas += `
        <tr>
          <td>${item.nome}</td>
          <td>${item.telefone}</td>
          <td>${item.cpf}</td>
          <td>${item.email}</td>
          <td><a href="/editar?id=${item.id}">link</a></td>
        </tr>
      `;
          });

          tbody.innerHTML = linhas;
        })
        .catch((erro) => console.error("Erro:", erro));
    </script>
  </body>
</html>
